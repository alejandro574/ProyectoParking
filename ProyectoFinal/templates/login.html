<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="login-box">

    <h1>Acceso administrador</h1>

    <form method="POST">

        <input
            type="text"
            name="usuario"
            placeholder="Usuario"
            required>

        <input
            type="password"
            name="password"
            placeholder="Contraseña"
            required>

        <button type="submit">
            Entrar
        </button>

    </form>

    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}

</div>

</body>
</html>
